<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Προαστιακός · Στάσεις</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E14;
  --surface:#131822;
  --surface2:#1B2230;
  --edge:#262F40;
  --amber:#FFB300;
  --amber-dim:#8a6100;
  --teal:#37D6C4;
  --blue:#5B9DF9;
  --bus:#C792EA;
  --text:#F3F1E9;
  --text-dim:#8C96AB;
  --text-faint:#5B647A;
  --danger:#FF6B6B;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 15% 0%, rgba(55,214,196,0.08), transparent 45%),
    radial-gradient(circle at 90% 8%, rgba(255,179,0,0.06), transparent 40%),
    var(--bg);
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

.eyebrow{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-size:11px;
  color:var(--text-faint);
}

/* Header */
header{
  position:sticky; top:0; z-index:30;
  background:rgba(11,14,20,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge);
  padding:14px 16px 12px;
}
.head-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(155deg, var(--teal), var(--blue));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace; font-weight:700; color:#06110f; font-size:14px;
  flex:none;
}
.brand-text h1{
  margin:0; font-family:'Barlow Condensed',sans-serif; font-weight:700;
  font-size:20px; line-height:1; letter-spacing:.01em;
}
.brand-text .sub{font-size:11px;color:var(--text-dim); margin-top:3px;}
.lang-toggle{
  display:flex; background:var(--surface2); border:1px solid var(--edge); border-radius:999px; padding:3px;
}
.lang-toggle button{
  border:none;background:transparent;color:var(--text-dim);font-family:'Space Mono',monospace;
  font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; cursor:pointer;
}
.lang-toggle button.active{background:var(--amber); color:#1a1204;}

/* Search */
.search-wrap{padding:14px 16px 4px;}
.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--edge); border-radius:var(--radius);
  padding:11px 14px;
}
.search-box svg{flex:none; opacity:.55;}
.search-box input{
  flex:1; background:transparent; border:none; outline:none; color:var(--text);
  font-family:'Inter',sans-serif; font-size:15px;
}
.search-box input::placeholder{color:var(--text-faint);}
.search-box .clear-btn{
  border:none;background:var(--surface2);color:var(--text-dim);width:22px;height:22px;border-radius:50%;
  font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;flex:none;
}

.chip-row{
  display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none;
}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex:none; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:14px;
  background:var(--surface); border:1px solid var(--edge); color:var(--text);
  padding:8px 14px; border-radius:999px; cursor:pointer; white-space:nowrap;
}
.chip:active{background:var(--surface2);}

.planner-trigger{
  margin-top:10px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  background:linear-gradient(135deg, rgba(55,214,196,0.14), rgba(91,157,249,0.10));
  border:1px solid rgba(55,214,196,0.35); color:var(--teal);
  font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:14.5px;
  padding:10px 14px; border-radius:12px; cursor:pointer;
}
.planner-trigger:active{background:rgba(55,214,196,0.22);}

/* Trip planner panel */
.planner-panel{display:none;}
.planner-panel.active{display:block;}
.planner-form{
  background:var(--surface); border:1px solid var(--edge); border-radius:16px; padding:14px; margin:14px 0;
}
.planner-fields{ display:flex; align-items:flex-start; gap:10px; }
.planner-field-stack{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.planner-field-unit{ position:relative; }
.planner-field{
  display:flex; align-items:center; gap:10px;
  background:var(--surface2); border:1px solid var(--edge); border-radius:11px;
  padding:11px 12px;
}
.planner-field:focus-within{ border-color:var(--teal); }
.planner-field .pf-icon{ flex:none; opacity:.6; }
.planner-field .pf-text{ flex:1; min-width:0; }
.planner-field .pf-label{ font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); font-family:'Space Mono',monospace; }
.planner-field .pf-input{
  width:100%; background:transparent; border:none; outline:none; color:var(--text); padding:0; margin-top:1px;
  font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:16px;
}
.planner-field .pf-input::placeholder{ color:var(--text-faint); font-weight:500; font-family:'Inter',sans-serif; font-size:14px; }
.pf-dropdown{
  display:none; flex-direction:column; position:relative; z-index:5;
  margin-top:6px; background:var(--surface); border:1px solid var(--edge); border-radius:11px;
  overflow:hidden; max-height:42vh; overflow-y:auto;
}
.pf-dropdown.open{ display:flex; }
.planner-swap{
  flex:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--edge); background:var(--surface2);
  color:var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.planner-when{ display:flex; gap:10px; margin-top:12px; }
.pw-block{ flex:1; min-width:0; }
.pw-block .pf-label{ font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); font-family:'Space Mono',monospace; margin-bottom:6px; }
.pw-time-wrap{
  display:flex; align-items:center; gap:8px;
  background:var(--surface2); border:1px solid var(--edge); border-radius:9px; padding:9px 10px;
  color:var(--text-dim);
}
.pw-time-input{
  flex:1; background:transparent; border:none; outline:none; color:var(--text);
  font-family:'Space Mono',monospace; font-weight:700; font-size:14px; min-width:0;
  color-scheme: dark;
}
.planner-submit{
  width:100%; margin-top:12px; background:var(--teal); color:#062420; border:none; border-radius:11px;
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; padding:11px; cursor:pointer;
}
.planner-submit:disabled{ opacity:.4; }
.planner-results{ margin-top:4px; }
.itinerary-card{
  background:var(--surface); border:1px solid var(--edge); border-radius:14px; padding:14px; margin-bottom:12px;
}
.itinerary-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.itinerary-head .total-time{ font-family:'Space Mono',monospace; font-size:12px; color:var(--text-dim); }
.itinerary-head .badge-direct{ font-family:'Space Mono',monospace; font-size:10px; color:var(--teal); border:1px solid rgba(55,214,196,0.4); border-radius:5px; padding:2px 6px; }
.leg{ display:flex; gap:10px; }
.leg-rail{ display:flex; flex-direction:column; align-items:center; flex:none; width:14px; }
.leg-dot{ width:8px; height:8px; border-radius:50%; background:var(--amber); flex:none; }
.leg-line{ width:2px; flex:1; background:var(--edge); margin:2px 0; min-height:18px; }
.leg-body{ flex:1; padding-bottom:14px; }
.leg-time{ font-family:'Space Mono',monospace; font-weight:700; font-size:15px; }
.leg-station{ font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:14.5px; margin-top:1px; }
.leg-meta{ font-size:11px; color:var(--text-dim); margin-top:2px; }
.transfer-note{
  font-size:11px; color:var(--amber); background:rgba(255,179,0,0.08); border:1px solid rgba(255,179,0,0.25);
  border-radius:8px; padding:5px 9px; margin:4px 0 8px; display:inline-block;
}
.planner-empty{ text-align:center; color:var(--text-dim); font-size:13px; padding:16px 10px; }

/* results dropdown list of matching stations */
#station-results{
  margin:0 16px; display:none; flex-direction:column;
  background:var(--surface); border:1px solid var(--edge); border-radius:var(--radius);
  overflow:hidden; max-height:47vh; overflow-y:auto;
}
.station-result{
  padding:12px 14px; display:flex; align-items:baseline; justify-content:space-between;
  border-bottom:1px solid var(--edge); cursor:pointer;
}
.station-result:last-child{border-bottom:none;}
.station-result:active{background:var(--surface2);}
.station-result .name-el{font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:17px;}
.station-result .name-en{color:var(--text-dim); font-size:12px; margin-left:8px;}
.station-result .count{font-family:'Space Mono',monospace; font-size:11px; color:var(--text-faint);}

/* Main */
main{flex:1; padding:8px 16px 40px;}

.empty-state{
  margin-top:10vh; text-align:center; color:var(--text-dim); padding:0 20px;
}
.empty-state .glyph{font-size:34px; margin-bottom:10px;}
.empty-state h2{font-family:'Barlow Condensed',sans-serif; font-size:22px; color:var(--text); margin:0 0 6px;}
.empty-state p{font-size:13.5px; line-height:1.5; margin:0;}

/* Network map */
.map-hint{
  text-align:center; font-size:12px; color:var(--text-faint); margin:2px 0 10px;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.map-wrap{
  position:relative; border:1px solid var(--edge); border-radius:16px; overflow:auto;
  background:#EFEDE4; -webkit-overflow-scrolling:touch;
}
.map-scroll{
  overflow:visible;
}
.map-inner{
  position:relative; width:100%;
}
@media (max-width:640px){
  .map-inner{ width:175%; }
}
.map-inner svg{ display:block; width:100%; height:auto; }
.map-hotspot{
  position:absolute; transform:translate(-50%,-50%);
  width:26px; height:26px;
  border:none; background:transparent; padding:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
  z-index:2;
}
.map-hotspot .dot{
  width:9px; height:9px; border-radius:50%;
  background:#E8483A;
  box-shadow:0 0 0 2px #fff, 0 1px 3px rgba(0,0,0,0.5);
  transition:transform .15s ease;
  pointer-events:none;
}
.map-hotspot:active .dot{ transform:scale(1.9); background:#37D6C4; }
.map-label{
  position:absolute; top:0; white-space:nowrap; pointer-events:none; z-index:1;
  font-family:'Barlow Condensed',sans-serif; font-weight:600;
  font-size:clamp(8px, 1.7vw, 11px);
  color:#1E2430; letter-spacing:.01em;
  text-shadow:0 0 3px #EFEDE4, 0 0 3px #EFEDE4, 0 0 3px #EFEDE4, 0 0 5px #EFEDE4;
}
.map-label.dir-right{ transform:translate(9px,-50%); }
.map-label.dir-left{ transform:translate(calc(-100% - 9px),-50%); }
.map-legend{
  display:flex; justify-content:center; gap:14px; padding:10px 6px 2px; flex-wrap:wrap;
}
.map-legend span{
  font-family:'Space Mono',monospace; font-size:10px; color:var(--text-faint);
  display:flex; align-items:center; gap:5px;
}
.map-legend i{width:7px;height:7px;border-radius:50%; background:#E8483A; display:inline-block;}

/* Station header + hero */
.station-panel{display:none;}
.station-panel.active{display:block;}

.station-title-row{
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin:14px 0 10px;
}
.station-title h2{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:28px; margin:0; line-height:1.05;
}
.station-title .alt-name{color:var(--text-dim); font-size:13px; margin-top:2px;}
.back-btn{
  flex:none; border:1px solid var(--edge); background:var(--surface); color:var(--text-dim);
  width:34px;height:34px;border-radius:10px; cursor:pointer; font-size:16px; display:flex;align-items:center;justify-content:center;
}

/* day toggle */
.day-toggle{
  display:flex; gap:6px; background:var(--surface); border:1px solid var(--edge);
  padding:4px; border-radius:999px; margin-bottom:14px;
}
.day-toggle button{
  flex:1; border:none; background:transparent; color:var(--text-dim);
  font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13.5px;
  padding:8px 4px; border-radius:999px; cursor:pointer;
}
.day-toggle button.active{background:var(--teal); color:#062420;}

.station-alert{
  display:flex; align-items:flex-start; gap:8px;
  background:rgba(255,179,0,0.08); border:1px solid rgba(255,179,0,0.3); border-radius:12px;
  padding:10px 12px; margin-bottom:14px; font-size:12.5px; color:var(--amber); line-height:1.4;
}
.station-alert svg{flex:none; margin-top:1px;}

/* Next departure hero - split flap */
.next-hero{
  border-radius:18px; padding:16px 18px 18px;
  background:linear-gradient(160deg, var(--surface2), var(--surface));
  border:1px solid var(--edge);
  margin-bottom:16px;
  position:relative; overflow:hidden;
}
.next-hero::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px);
}
.next-hero .eyebrow{margin-bottom:8px;}
.next-hero-body{display:flex; align-items:center; justify-content:space-between; gap:14px;}
.next-hero-body + .next-hero-body{ margin-top:10px; padding-top:10px; border-top:1px solid var(--edge); }
.flap-time{
  font-family:'Space Mono',monospace; font-weight:700; font-size:36px; color:var(--amber);
  letter-spacing:.02em; text-shadow:0 0 18px rgba(255,179,0,0.35);
  display:flex;
}
.flap-time span{display:inline-block;}
.flap-time span.flip{animation:flapin .5s cubic-bezier(.2,.9,.25,1);}
@keyframes flapin{
  0%{transform:rotateX(90deg); opacity:0;}
  60%{transform:rotateX(-8deg); opacity:1;}
  100%{transform:rotateX(0); opacity:1;}
}
.next-hero-meta{text-align:right;}
.next-hero-meta .countdown{font-family:'Space Mono',monospace; font-size:13px; color:var(--teal); font-weight:700;}
.next-hero-meta .dest{
  font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:600; margin-top:2px;
  display:flex; align-items:center; justify-content:flex-end; gap:6px;
}
.next-hero-meta .dest .line-dot{flex:none;}
.next-hero-meta .line-name{font-size:11px; color:var(--text-dim); margin-top:2px;}
.next-hero .no-more{font-family:'Barlow Condensed',sans-serif; font-size:18px; color:var(--text-dim); padding:6px 0;}

/* Departure list grouped by line */
.line-group{margin-bottom:10px; border-bottom:1px solid var(--edge);}
.line-group-head{
  display:flex; align-items:center; gap:8px; padding:10px 2px; cursor:pointer;
  -webkit-tap-highlight-color:transparent; background:none; border:none; width:100%; text-align:left;
}
.line-dot{width:9px;height:9px;border-radius:50%; flex:none;}
.line-group-head .a-code{
  font-family:'Space Mono',monospace; font-weight:700; font-size:10.5px; color:#062420;
  background:var(--teal); border-radius:5px; padding:2px 5px; flex:none;
}
.line-group-head h3{
  font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:15px; margin:0; color:var(--text);
  flex:1; min-width:0;
}
.line-group-head .scope-badge{
  font-family:'Space Mono',monospace; font-size:9.5px; color:var(--text-faint);
  border:1px solid var(--edge); border-radius:5px; padding:1px 5px; text-transform:uppercase;
}
.line-group-head .chevron{
  flex:none; color:var(--text-faint); transition:transform .2s ease;
}
.line-group-head.open .chevron{ transform:rotate(180deg); }
.line-group-body{ display:none; padding-bottom:8px; }
.line-group-body.open{ display:block; }

.dep-row{
  display:flex; align-items:center; gap:12px;
  padding:10px 4px; border-bottom:1px solid var(--edge);
}
.dep-row:last-child{border-bottom:none;}
.dep-row.past{opacity:.38;}
.dep-row.is-next{
  background:rgba(255,179,0,0.06); border-radius:10px; margin:0 -6px; padding:10px 10px; border-bottom:1px solid transparent;
}
.dep-time{
  font-family:'Space Mono',monospace; font-weight:700; font-size:19px; color:var(--text);
  width:62px; flex:none;
}
.dep-row.is-next .dep-time{color:var(--amber);}
.dep-mid{flex:1; min-width:0;}
.dep-dest{font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:15.5px; display:flex; align-items:center; gap:6px;}
.dep-dest .arrow{color:var(--text-faint); font-size:13px;}
.dep-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.train-no{font-family:'Space Mono',monospace;}
.tag{
  font-family:'Space Mono',monospace; font-size:9px; padding:1px 5px; border-radius:4px; border:1px solid var(--edge); color:var(--text-dim);
}
.tag.warn{color:var(--danger); border-color:rgba(255,107,107,0.4);}
.mode-icon{flex:none; opacity:.75;}

.section-note{
  font-size:11.5px; color:var(--text-faint); line-height:1.5; margin:6px 2px 0;
}

.no-results{
  text-align:center; color:var(--text-dim); padding:22px 10px; font-size:13.5px;
}

footer{
  padding:22px 16px 34px; text-align:center; color:var(--text-faint); font-size:11px; line-height:1.7;
}
footer a{color:var(--text-dim);}

.hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div class="brand">
      <div class="brand-mark">HT</div>
      <div class="brand-text">
        <h1 data-t="title">Προαστιακός</h1>
        <div class="sub" data-t="subtitle">Ώρες αναχώρησης ανά στάση</div>
      </div>
    </div>
    <div class="lang-toggle">
      <button id="lang-el" class="active">EL</button>
      <button id="lang-en">EN</button>
    </div>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search-input" type="text" data-t="searchPlaceholder" placeholder="Αναζήτηση στάσης…" autocomplete="off">
    <button class="clear-btn" id="clear-search">✕</button>
  </div>
  <button class="planner-trigger" id="planner-trigger">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 21l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    <span data-t="plannerTrigger">Σχεδίασε διαδρομή με μεταφορά</span>
  </button>
</div>

<div class="chip-row" id="quick-chips"></div>

<div id="station-results"></div>

<main>
  <div class="empty-state" id="empty-state">
    <p class="map-hint">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      <span data-t="mapHint">Πάτα σε μια στάση στον χάρτη — ή σμίκρυνε/μεγέθυνε για ακρίβεια</span>
    </p>
    <div class="map-wrap">
      <div class="map-scroll">
        <div class="map-inner" id="map-inner">
          <svg id="network-map-svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2834.65 2834.65" preserveAspectRatio="xMidYMid meet">
<defs>
<g>
<g id="glyph-0-0">
<path d="M 5.203125 -14.09375 L 8.390625 -14.09375 L 13.65625 0 L 10.4375 0 L 9.375 -3.140625 L 4.109375 -3.140625 L 3 0 L -0.140625 0 Z M 8.5625 -5.453125 L 6.78125 -10.609375 L 6.75 -10.609375 L 4.90625 -5.453125 Z M 8.5625 -5.453125 "/>

  <div class="planner-panel" id="planner-panel">
    <div class="station-title-row">
      <div class="station-title">
        <h2 data-t="plannerTitle">Σχεδιασμός διαδρομής</h2>
        <div class="alt-name" data-t="plannerSubtitle">Με αυτόματη εύρεση μεταφοράς αν χρειάζεται</div>
      </div>
      <button class="back-btn" id="planner-back-btn">✕</button>
    </div>

    <div class="planner-form">
      <div class="planner-fields">
        <div class="planner-field-stack">
          <div class="planner-field-unit">
            <div class="planner-field">
              <svg class="pf-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
              <div class="pf-text">
                <div class="pf-label" data-t="plannerFrom">ΑΠΟ</div>
                <input class="pf-input" id="planner-from-input" type="text" data-t-placeholder="plannerChoose" placeholder="Επίλεξε στάση" autocomplete="off">
              </div>
            </div>
            <div class="pf-dropdown" id="planner-from-dropdown"></div>
          </div>
          <div class="planner-field-unit">
            <div class="planner-field">
              <svg class="pf-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
              <div class="pf-text">
                <div class="pf-label" data-t="plannerTo">ΠΡΟΣ</div>
                <input class="pf-input" id="planner-to-input" type="text" data-t-placeholder="plannerChoose" placeholder="Επίλεξε στάση" autocomplete="off">
              </div>
            </div>
            <div class="pf-dropdown" id="planner-to-dropdown"></div>
          </div>
        </div>
        <button class="planner-swap" id="planner-swap-btn" aria-label="swap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v18M7 21l-4-4M7 21l4-4M17 21V3M17 3l-4 4M17 3l4 4"/></svg>
        </button>
      </div>

      <div class="planner-when">
        <div class="pw-block" style="flex:1;">
          <div class="pf-label" data-t="plannerWhenTime">ΩΡΑ ΑΝΑΧΩΡΗΣΗΣ</div>
          <div class="pw-time-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>

        </div>
      </div>

        <button data-mode="auto" class="active" data-t="modeAuto">Αυτόματα</button>

        <button data-mode="weekend" data-t="modeWeekend">Σ/Κ &amp; αργίες</button>
        <button data-mode="both" data-t="modeBoth">Όλα</button>

let LANG = 'el';
let currentStationId = null;
let dayMode = 'auto';
let tickTimer = null;
let plannerFrom = null;
let plannerTo = null;
let plannerDayMode = 'auto';

const TRIPS = APP_DATA.trips || []; // [lineIdx, dirIdx, weekdayOnlyFlag, trainNo, [[stationId,timeStr],...]]
const STATION_TRIP_INDEX = {};
TRIPS.forEach((tr, ti) => {
  tr[4].forEach((stop, si) => {
    const sid = stop[0];
    if (!STATION_TRIP_INDEX[sid]) STATION_TRIP_INDEX[sid] = [];
    STATION_TRIP_INDEX[sid].push([ti, si]);
  });
});

function tripDayOk(tr, mode){
  const scope = LINES[tr[0]].dayScope;
  if (mode === 'both') return true;
  if (scope === 'weekday' && mode === 'weekend') return false;
  if (scope === 'weekend' && mode === 'weekday') return false;
  if (tr[2] === 1 && mode === 'weekend') return false;
  return true;
}
function adjMin(m){ return m < 180 ? m + 1440 : m; }

function plannerEffectiveMode(){
  if (plannerDayMode === 'auto') return isWeekendToday() ? 'weekend' : 'weekday';
  return plannerDayMode;
}

function plannerAfterMinutes(){
  const input = document.getElementById('planner-time-input');
  const v = input && input.value; // "HH:MM"
  if (!v) return nowMinutes();
  const [h, m] = v.split(':').map(n => parseInt(n, 10));
  if (isNaN(h) || isNaN(m)) return nowMinutes();
  return h * 60 + m;
}

function planTrip(fromId, toId, afterMin, mode, maxResults){
  maxResults = maxResults || 4;
  const buffer = 3;

  let direct = [];
  (STATION_TRIP_INDEX[fromId] || []).forEach(([ti, i]) => {
    const tr = TRIPS[ti];
    if (!tripDayOk(tr, mode)) return;
    const stops = tr[4];
    for (let j = i + 1; j < stops.length; j++){
      if (stops[j][0] === toId){
        const dep = adjMin(timeToMinutes(stops[i][1]));
        if (dep >= afterMin) direct.push({ dep, tr, i, j });
        break;
      }
    }
  });
  if (direct.length){
    direct.sort((a,b) => a.dep - b.dep);
    return { kind: 'direct', options: direct.slice(0, maxResults) };
  }

  let candidates = [];
  (STATION_TRIP_INDEX[fromId] || []).forEach(([t1i, i1]) => {
    const tr1 = TRIPS[t1i];
    if (!tripDayOk(tr1, mode)) return;
    const stops1 = tr1[4];
    const dep1 = adjMin(timeToMinutes(stops1[i1][1]));
    if (dep1 < afterMin) return;
    let best = null;
    for (let k = i1 + 1; k < stops1.length; k++){
      const transferSt = stops1[k][0];
      const arr1 = adjMin(timeToMinutes(stops1[k][1]));
      const atTransfer = STATION_TRIP_INDEX[transferSt] || [];
      for (const [t2i, it2] of atTransfer){
        if (t2i === t1i) continue;
        const tr2 = TRIPS[t2i];
        if (!tripDayOk(tr2, mode)) continue;
        const stops2 = tr2[4];
        const dep2 = adjMin(timeToMinutes(stops2[it2][1]));
        if (dep2 < arr1 + buffer) continue;
        for (let j2 = it2 + 1; j2 < stops2.length; j2++){
          if (stops2[j2][0] === toId){
            const arr2 = adjMin(timeToMinutes(stops2[j2][1]));
            const wait = dep2 - arr1;
            // Ties on arrival time keep whichever transfer station was found first (k
            // increases along the route), i.e. the earliest shared stop between the two
            // lines - even if that means a longer wait there than a later transfer point.
            if (!best || arr2 < best.arr2){
              best = { arr2, wait, tr1, i1, k, transferSt, tr2, it2, j2, dep1, arr1, dep2 };
            }
            break;
          }
        }
      }
    }
    if (best) candidates.push(best);
  });
  if (candidates.length){
    candidates.sort((a,b) => a.dep1 - b.dep1);
    return { kind: 'transfer', options: candidates.slice(0, maxResults) };
  }

  // Two transfers (three legs) - only tried once direct and one-transfer both come up empty.
  let candidates2 = [];
  (STATION_TRIP_INDEX[fromId] || []).forEach(([t1i, i1]) => {
    const tr1 = TRIPS[t1i];
    if (!tripDayOk(tr1, mode)) return;
    const stops1 = tr1[4];
    const dep1 = adjMin(timeToMinutes(stops1[i1][1]));
    if (dep1 < afterMin) return;
    let best = null;
    for (let k1 = i1 + 1; k1 < stops1.length; k1++){
      const transferA = stops1[k1][0];
      const arrA = adjMin(timeToMinutes(stops1[k1][1]));
      const atA = STATION_TRIP_INDEX[transferA] || [];
      for (const [t2i, i2] of atA){
        if (t2i === t1i) continue;
        const tr2 = TRIPS[t2i];
        if (!tripDayOk(tr2, mode)) continue;
        const stops2 = tr2[4];
        const dep2 = adjMin(timeToMinutes(stops2[i2][1]));
        if (dep2 < arrA + buffer) continue;
        for (let k2 = i2 + 1; k2 < stops2.length; k2++){
          const transferB = stops2[k2][0];
          const arrB = adjMin(timeToMinutes(stops2[k2][1]));
          const atB = STATION_TRIP_INDEX[transferB] || [];
          for (const [t3i, i3] of atB){
            if (t3i === t2i || t3i === t1i) continue;
            const tr3 = TRIPS[t3i];
            if (!tripDayOk(tr3, mode)) continue;
            const stops3 = tr3[4];
            const dep3 = adjMin(timeToMinutes(stops3[i3][1]));
            if (dep3 < arrB + buffer) continue;
            for (let j3 = i3 + 1; j3 < stops3.length; j3++){
              if (stops3[j3][0] === toId){
                const arr3 = adjMin(timeToMinutes(stops3[j3][1]));
                const wait1 = dep2 - arrA, wait2 = dep3 - arrB;
                // Same tie-break as the one-transfer search: on equal arrival, keep the
                // earliest-found (earliest shared) transfer stations over shorter waits.
                if (!best || arr3 < best.arr3){
                  best = { tr1, i1, k1, transferA, tr2, i2, k2, transferB, tr3, i3, j3,
                            dep1, arrA, dep2, arrB, dep3, arr3, wait1, wait2 };
                }
                break;
              }
            }
          }
        }
      }
    }
    if (best) candidates2.push(best);
  });
  candidates2.sort((a,b) => a.dep1 - b.dep1);
  return { kind: candidates2.length ? 'transfer2' : 'none', options: candidates2.slice(0, maxResults) };
}

function t(key){ return I18N[LANG][key]; }
function stName(id){ return LANG==='el' ? STATIONS[id][1] : STATIONS[id][0]; }
function stAlt(id){ return LANG==='el' ? STATIONS[id][0] : STATIONS[id][1]; }
function lineName(idx){ const l = LINES[idx]; return LANG==='el' ? l.nameEl : l.nameEn; }

// Matches the A1-A4 line codes on the official network map. The Airport line's id
// covers both the full Piraeus route (A1) and the shorter Ano Liosia route (A2), which
// only fork apart via Kato Acharnai (A1) vs SKA (A2) - so where destination alone
// doesn't say which one a departure belongs to, look up its actual stopping pattern.
function lineCode(stationId, lineIdx, destSid, trainNo){
  const lid = LINES[lineIdx].id;
  if (lid === 'athens_chalkida') return 'A3';
  if (lid === 'piraeus_kiato' || lid === 'kiato_aigio' || lid === 'kiato_patras') return 'A4';
  if (lid.startsWith('piraeus_airport') || lid.startsWith('airport_piraeus')){
    if (destSid === 'ano_liosia') return 'A2';
    if (destSid === 'piraeus') return 'A1';
    const match = (STATION_TRIP_INDEX[stationId] || []).find(([ti]) => {
      const tr = TRIPS[ti];
      return tr[0] === lineIdx && tr[3] === trainNo;
    });
    if (match) return TRIPS[match[0]][4].some(s => s[0] === 'kato_acharnai') ? 'A1' : 'A2';
    return 'A1';
  }
  return '';
}

function timeToMinutes(t){
  // most lines use "H.MM" but at least one (Kiato-Patras) is sourced as "H:MM"
  const parts = t.split(/[.:]/);
  return parseInt(parts[0],10)*60 + parseInt(parts[1],10);
}
function displayTime(tstr){ return tstr.replace('.', ':'); }
function nowMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function isWeekendToday(){
  const day = new Date().getDay(); // 0 Sun .. 6 Sat
  return day === 0 || day === 6;
}
function effectiveMode(){
  if (dayMode === 'auto') return isWeekendToday() ? 'weekend' : 'weekday';
  return dayMode;
}

function passesFilter(depLine, weekdayOnlyFlag){
  const mode = effectiveMode();
  if (mode === 'both') return true;
  const scope = LINES[depLine].dayScope; // all | weekday | weekend
  if (scope === 'weekday' && mode === 'weekend') return false;
  if (scope === 'weekend' && mode === 'weekday') return false;
  if (weekdayOnlyFlag === 1 && mode === 'weekend') return false;
  return true;
}

function normalizeSearch(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function matchStations(query){
  const q = normalizeSearch(query.trim());
  if (!q) return [];
  return Object.entries(STATIONS).filter(([id, pair]) => {
    return normalizeSearch(pair[0]).includes(q) || normalizeSearch(pair[1]).includes(q);
  }).sort((a,b) => a[1][LANG==='el'?1:0].localeCompare(b[1][LANG==='el'?1:0]));
}

function buildQuickChips(){
  const wrap = document.getElementById('quick-chips');
  wrap.innerHTML = '';
  const names = t('quick');
  const idsByEn = {};
  for (const [id, pair] of Object.entries(STATIONS)) idsByEn[pair[0]] = id;
  const targetEn = ['Athens','Piraeus','Kiato','Airport','Chalkida','Patras'];
  targetEn.forEach((en, i) => {
    const id = idsByEn[en];
    if (!id) return;
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = names[i];
    btn.onclick = () => selectStation(id);
    wrap.appendChild(btn);
  });
}

function renderMapHotspots(){
  const inner = document.getElementById('map-inner');
  const hotspots = APP_DATA.mapHotspots || {};
  document.querySelectorAll('.map-hotspot, .map-label').forEach(el => el.remove());

  // Stations whose dots sit almost on top of each other (e.g. Aigio/Diakopto/Patras)
  // would otherwise print overlapping labels, so nearby ones get stacked vertically.
  const minGap = 2.1;
  const placedLabelYs = [];
  const entries = Object.entries(hotspots).filter(([sid]) => STATIONS[sid]).sort((a,b) => a[1].y - b[1].y);

  entries.forEach(([sid, h]) => {
    const btn = document.createElement('button');
    btn.className = 'map-hotspot';
    btn.style.left = h.x + '%';
    btn.style.top = h.y + '%';
    btn.setAttribute('aria-label', stName(sid));
    btn.innerHTML = '<span class="dot"></span>';
    btn.onclick = () => selectStation(sid);
    inner.appendChild(btn);

    let labelY = h.y;
    placedLabelYs.forEach(p => {
      if (Math.abs(p.x - h.x) < 3 && Math.abs(p.y - labelY) < minGap) labelY = p.y + minGap;
    });
    placedLabelYs.push({ x: h.x, y: labelY });

    const label = document.createElement('span');
    label.className = 'map-label ' + (h.x > 82 ? 'dir-left' : 'dir-right');
    label.style.left = h.x + '%';
    label.style.top = labelY + '%';
    label.textContent = stName(sid);
    inner.appendChild(label);
  });
}

function renderStationResults(query){
  const box = document.getElementById('station-results');
  box.innerHTML = '';
  if (!query){ box.style.display = 'none'; return; }
  const matches = matchStations(query);

  if (matches.length === 0){
    box.style.display = 'flex';
    const div = document.createElement('div');
    div.className = 'no-results';
    div.textContent = t('noResults');
    box.appendChild(div);
    return;
  }
  box.style.display = 'flex';
  matches.slice(0, 30).forEach(([id, pair]) => {
    const row = document.createElement('div');
    row.className = 'station-result';
    const depCount = (DEPARTURES[id] || []).filter(d => d[6] !== 1).length;
    row.innerHTML = `<span><span class="name-el">${stName(id)}</span><span class="name-en">${stAlt(id)}</span></span><span class="count">${depCount}</span>`;
    // onmousedown fires before the input's blur, so the selection registers first
    row.onmousedown = (e) => { e.preventDefault(); selectStation(id); };
    box.appendChild(row);
  });
}

function selectStation(id){
  currentStationId = id;
  document.getElementById('search-input').value = '';
  document.getElementById('station-results').style.display = 'none';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('planner-panel').classList.remove('active');
  document.getElementById('station-panel').classList.add('active');
  renderStationPanel();
  window.scrollTo({top:0, behavior:'smooth'});
  if (tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(renderStationPanel, 30000);
}

function backToSearch(){
  currentStationId = null;
  document.getElementById('station-panel').classList.remove('active');
  document.getElementById('planner-panel').classList.remove('active');
  document.getElementById('empty-state').style.display = 'block';
  if (tickTimer) clearInterval(tickTimer);
}

function openPlanner(){
  document.getElementById('station-results').style.display = 'none';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('station-panel').classList.remove('active');
  document.getElementById('planner-panel').classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
  if (tickTimer) clearInterval(tickTimer);
}

function renderFieldDropdown(target, query){
  const box = document.getElementById('planner-' + target + '-dropdown');
  box.innerHTML = '';
  const q = (query || '').trim();
  if (!q){ box.classList.remove('open'); return; }
  const matches = matchStations(q);
  if (matches.length === 0){
    box.classList.add('open');
    const div = document.createElement('div');
    div.className = 'no-results';
    div.textContent = t('noResults');
    box.appendChild(div);
    return;
  }
  box.classList.add('open');
  matches.slice(0, 20).forEach(([id, pair]) => {
    const row = document.createElement('div');
    row.className = 'station-result';
    row.innerHTML = `<span><span class="name-el">${stName(id)}</span><span class="name-en">${stAlt(id)}</span></span>`;
    // onmousedown fires before the input's blur, so the selection registers first
    row.onmousedown = (e) => { e.preventDefault(); setPlannerField(target, id); };
    box.appendChild(row);
  });
}

function setPlannerField(target, id){
  if (target === 'from') plannerFrom = id; else plannerTo = id;
  const input = document.getElementById('planner-' + target + '-input');
  input.value = stName(id);
  document.getElementById('planner-' + target + '-dropdown').classList.remove('open');
  document.getElementById('planner-submit').disabled = !(plannerFrom && plannerTo);
  renderPlannerResults();
}

function durationLabel(startMin, endMin){
  const d = Math.max(0, endMin - startMin);
  const h = Math.floor(d/60), m = d%60;
  return (h>0 ? h+'h ' : '') + m + t('min');
}

function transferNoteText(stationId, waitMin){
  const base = `${t('transferAt')} ${stName(stationId)} · ${t('waitLabel')} ${waitMin} ${t('min')}`;
  return stationId === 'ska' ? `${base} · ⚠ ${t('walkRequired')}` : base;
}

function renderStationPanel(){
  if (!currentStationId) return;
  const id = currentStationId;
  document.getElementById('station-name-main').textContent = stName(id);
  document.getElementById('station-name-alt').textContent = stAlt(id);

  const alertBox = document.getElementById('station-alert');
  alertBox.innerHTML = id === 'ska'
    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.71 3.86a2 2 0 0 0-3.42 0z"/></svg><span>${t('skaWalkNote')}</span>`
    : '';

  const all = DEPARTURES[id] || [];
  // isDest marks a row where this station is the trip's final stop - it's an arrival
  // record, not a boardable departure, so it doesn't belong on a departures board.
  const filtered = all.filter(d => d[6] !== 1 && passesFilter(d[0], d[5]));
  const now = nowMinutes();

  // Group by line+direction+actual destination (not just line+direction): some lines
  // (e.g. the Airport line) run a mix of full-route and shorter-turnback trips - e.g.
  // some "Airport-Piraeus" departures actually only run as far as Ano Liosia - so two
  // trips sharing a line/direction can still end at different stations.
  const groups = {};
  const groupOrder = [];
  filtered.forEach(d => {
    const code = lineCode(id, d[0], d[4], d[3]);
    const key = d[0] + '_' + d[1] + '_' + d[4] + '_' + code;
    if (!groups[key]){ groups[key] = []; groupOrder.push(key); }
    groups[key].push(d);
  });

  // Next departure per direction (line+direction group) rather than just one overall
  const nextByGroup = {};
  groupOrder.forEach(key => {
    for (const d of groups[key]){
      const mins = timeToMinutes(d[2]);
      const adj = mins < 180 ? mins + 1440 : mins; // after-midnight run counts as late "today"
      if (adj >= now){ nextByGroup[key] = d; break; }
    }
  });

  const hero = document.getElementById('next-hero');
  const upcomingKeys = groupOrder.filter(key => nextByGroup[key]);
  if (upcomingKeys.length){
    const rows = upcomingKeys.map(key => {
      const d = nextByGroup[key];
      const lineIdx = d[0];
      const color = LINE_COLORS[LINES[lineIdx].id] || 'var(--teal)';
      const destName = stName(d[4]);
      const mins = timeToMinutes(d[2]);
      const adj = mins < 180 ? mins + 1440 : mins;
      const diff = Math.max(0, adj - now);
      const timeStr = displayTime(d[2]);
      return `
      <div class="next-hero-body">
        <div class="flap-time">${[...timeStr].map(ch=>`<span>${ch}</span>`).join('')}</div>
        <div class="next-hero-meta">
          <div class="countdown">${diff===0? t('now') : diff+' '+t('min')}</div>
          <div class="dest"><span class="line-dot" style="background:${color}"></span>${t('towards')} ${destName}</div>
          <div class="line-name">${lineName(lineIdx)} · ${d[3]}</div>
        </div>
      </div>`;
    }).join('');
    hero.innerHTML = `<div class="eyebrow">${t('next')}</div>${rows}`;
  } else {
    hero.innerHTML = `<div class="eyebrow">${t('next')}</div><div class="no-more">${t('noMore')}</div>`;
  }

  const wrap = document.getElementById('line-groups');
  wrap.innerHTML = '';
  if (groupOrder.length === 0 && filtered.length === 0 && all.length === 0){
    wrap.innerHTML = `<div class="no-results">${t('noResults')}</div>`;
  }
  groupOrder.forEach(key => {
    const deps = groups[key];
    const first = deps[0];
    const lineIdx = first[0], destSid = first[4];
    const code = lineCode(id, lineIdx, destSid, first[3]);
    const color = LINE_COLORS[LINES[lineIdx].id] || 'var(--teal)';
    const scope = LINES[lineIdx].dayScope;

    const head = document.createElement('button');
    head.className = 'line-group-head';
    let scopeBadge = '';
    if (scope === 'weekday') scopeBadge = `<span class="scope-badge">${t('weekdaysOnly')}</span>`;
    if (scope === 'weekend') scopeBadge = `<span class="scope-badge">${t('weekendOnly')}</span>`;
    const codeBadge = code ? `<span class="a-code">${code}</span>` : '';
    head.innerHTML = `<span class="line-dot" style="background:${color}"></span>${codeBadge}<h3>${lineName(lineIdx)} · ${t('towards')} ${stName(destSid)}</h3>${scopeBadge}<svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;

    const groupDiv = document.createElement('div');
    groupDiv.className = 'line-group';
    groupDiv.appendChild(head);

    const body = document.createElement('div');
    body.className = 'line-group-body';
    head.onclick = () => {
      head.classList.toggle('open');
      body.classList.toggle('open');
    };

    deps.forEach(d => {
      const mins = timeToMinutes(d[2]);
      const adj = mins < 180 ? mins + 1440 : mins;
      const isPast = adj < now;
      const isNext = d === nextByGroup[key];
      const row = document.createElement('div');
      row.className = 'dep-row' + (isPast? ' past':'') + (isNext? ' is-next':'');
      const kindIcon = LINES[lineIdx].kind === 'bus'
        ? '<svg class="mode-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="2"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/></svg>'
        : '<svg class="mode-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="13" rx="3"/><line x1="4" y1="11" x2="20" y2="11"/><circle cx="8" cy="17" r="1"/><circle cx="16" cy="17" r="1"/></svg>';
      const weekdayOnlyTag = (d[5]===1) ? `<span class="tag warn">${t('notWeekend')}</span>` : '';
      row.innerHTML = `
        <div class="dep-time">${displayTime(d[2])}</div>
        <div class="dep-mid">
          <div class="dep-dest"><span class="arrow">${t('towards')}</span> ${stName(d[4])}</div>
          <div class="dep-sub">${kindIcon}<span class="train-no">${d[3]}</span>${weekdayOnlyTag}</div>
        </div>`;
      body.appendChild(row);
    });

    groupDiv.appendChild(body);
    wrap.appendChild(groupDiv);
  });

  if (filtered.length === 0 && all.length > 0){
    const note = document.createElement('div');
    note.className = 'no-results';
    note.textContent = t('noMore');
    wrap.appendChild(note);
  }
}

function setLang(lang){
  LANG = lang;
  document.documentElement.lang = lang;
  document.getElementById('lang-el').classList.toggle('active', lang==='el');
  document.getElementById('lang-en').classList.toggle('active', lang==='en');
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    if (I18N[lang][key]) el.innerHTML = I18N[lang][key];
  });
  document.querySelectorAll('[data-t-placeholder]').forEach(el => {
    const key = el.getAttribute('data-t-placeholder');
    if (I18N[lang][key]) el.placeholder = I18N[lang][key];
  });
  document.getElementById('search-input').placeholder = t('searchPlaceholder');
  buildQuickChips();
  renderMapHotspots();
  renderStationResults(document.getElementById('search-input').value);
  if (currentStationId) renderStationPanel();
  if (plannerFrom) document.getElementById('planner-from-input').value = stName(plannerFrom);
  if (plannerTo) document.getElementById('planner-to-input').value = stName(plannerTo);
  if (document.getElementById('planner-panel').classList.contains('active')) renderPlannerResults();
  document.getElementById('footer-note').innerHTML = t('footer');
}

document.getElementById('lang-el').onclick = () => setLang('el');
document.getElementById('lang-en').onclick = () => setLang('en');
document.getElementById('back-btn').onclick = backToSearch;
document.getElementById('search-input').addEventListener('input', e => {
  const v = e.target.value;
  document.getElementById('clear-search').style.display = v ? 'flex' : 'none';
  renderStationResults(v);
});
document.getElementById('search-input').addEventListener('focus', e => {
  if (e.target.value) renderStationResults(e.target.value);
});
document.getElementById('search-input').addEventListener('blur', () => {
  // slight delay so a row's onmousedown can run first
  setTimeout(() => { document.getElementById('station-results').style.display = 'none'; }, 150);
});
document.getElementById('clear-search').onclick = () => {
  document.getElementById('search-input').value = '';
  document.getElementById('clear-search').style.display = 'none';
  document.getElementById('station-results').style.display = 'none';
};
document.querySelectorAll('#day-toggle button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#day-toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    dayMode = btn.getAttribute('data-mode');
    renderStationPanel();
  };
});

document.getElementById('planner-trigger').onclick = openPlanner;
document.getElementById('planner-back-btn').onclick = backToSearch;

['from','to'].forEach(target => {
  const input = document.getElementById('planner-' + target + '-input');
  input.addEventListener('input', e => {
    // typing again invalidates a previously confirmed selection until a new one is picked
    if (target === 'from') plannerFrom = null; else plannerTo = null;
    document.getElementById('planner-submit').disabled = true;
    renderFieldDropdown(target, e.target.value);
  });
  input.addEventListener('focus', e => {
    if (e.target.value) renderFieldDropdown(target, e.target.value);
  });
  input.addEventListener('blur', () => {
    // slight delay so a row's onmousedown can run first
    setTimeout(() => document.getElementById('planner-' + target + '-dropdown').classList.remove('open'), 150);
  });
});

document.getElementById('planner-swap-btn').onclick = () => {
  const tmp = plannerFrom; plannerFrom = plannerTo; plannerTo = tmp;
  document.getElementById('planner-from-input').value = plannerFrom ? stName(plannerFrom) : '';
  document.getElementById('planner-to-input').value = plannerTo ? stName(plannerTo) : '';
  document.getElementById('planner-submit').disabled = !(plannerFrom && plannerTo);
  renderPlannerResults();
};
document.querySelectorAll('#planner-day-toggle button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#planner-day-toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    plannerDayMode = btn.getAttribute('data-mode');
    renderPlannerResults();
  };
});
document.getElementById('planner-time-input').addEventListener('input', renderPlannerResults);
document.getElementById('planner-submit').onclick = renderPlannerResults;

function initPlannerTime(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  document.getElementById('planner-time-input').value = hh + ':' + mm;
}

buildQuickChips();
renderMapHotspots();
initPlannerTime();
setLang('el');
</script>
